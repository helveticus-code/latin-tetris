<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Latin Case Blocks – Reusable Core</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100dvh;
  overflow: hidden;
  font-family: sans-serif;
  color: #fff;
  user-select: none;
  background: url("pool.svg") center / cover no-repeat fixed;
}

@media (pointer: coarse), (max-width: 820px) {
  html, body {
    background-attachment: scroll;
    background-position: center top;
  }
}

#bgOverlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.45);
  z-index: 0;
}

canvas {
  position: fixed;
  inset: 0;
  z-index: 1;
  width: 100vw;
  height: 100dvh;
  touch-action: none;
}

button {
  font-size: 16px;
  padding: 10px 16px;
}

#pauseBtn {
  position: fixed;
  top: 10px;
  right: 10px;
  z-index: 6;
}

.screen {
  position: fixed;
  inset: 0;
  z-index: 10;
  background: rgba(0,0,0,0.8);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

.hidden { display: none; }

#declTable {
  border-collapse: collapse;
  margin-top: 16px;
}

#declTable th, #declTable td {
  border: 1px solid rgba(255,255,255,0.4);
  padding: 10px 14px;
  text-align: center;
}

#declTable th {
  background: rgba(255,255,255,0.15);
}

.cell { cursor: pointer; }
.cell.disabled { opacity: 0.35; cursor: default; }
.cell.active:hover { background: rgba(255,255,255,0.2); }
</style>
</head>

<body>

<div id="bgOverlay"></div>
<canvas id="game"></canvas>
<button id="pauseBtn">Pause</button>

<!-- INTRO -->
<div id="introScreen" class="screen">
  <h1>Latin Case Blocks</h1>
  <p>Select declension and number</p>

  <table id="declTable">
    <tr>
      <th></th>
      <th>1st</th>
      <th>2nd masc</th>
      <th>2nd neut</th>
      <th>3rd</th>
      <th>4th</th>
      <th>5th</th>
    </tr>
    <tr>
      <th>Singular</th>
      <td class="cell active" data-decl="1st" data-num="sing">1st sing</td>
      <td class="cell disabled">2nd m sing</td>
      <td class="cell disabled">2nd n sing</td>
      <td class="cell disabled">3rd sing</td>
      <td class="cell disabled">4th sing</td>
      <td class="cell disabled">5th sing</td>
    </tr>
    <tr>
      <th>Plural</th>
      <td class="cell active" data-decl="1st" data-num="plur">1st plur</td>
      <td class="cell disabled">2nd m plur</td>
      <td class="cell disabled">2nd n plur</td>
      <td class="cell disabled">3rd plur</td>
      <td class="cell disabled">4th plur</td>
      <td class="cell disabled">5th plur</td>
    </tr>
  </table>
</div>

<!-- END -->
<div id="endScreen" class="screen hidden">
  <h1 id="endMsg"></h1>
  <button id="restart">Play Again</button>
</div>

<script>
/* ================= CORE STATE ================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const COLS = 5;
const STACK_TARGET = 3;
const colNames = ["Nom","Acc","Gen","Dat","Abl"];

let stacks, falling, spawn;
let lives, paused, win, lose, started;

const FALL_SPEED = 2.5 / 3;
const FAST_SPEED = 12.5;

let gameMode = { decl:null, number:null };

/* ================= RESIZE ================= */

function resize() {
  canvas.width = innerWidth;
  canvas.height = innerHeight;
}
resize();
addEventListener("resize", resize);

/* ================= ENDINGS ================= */

function buildEndings() {
  if (gameMode.decl === "1st" && gameMode.number === "sing") {
    return [
      {e:"-a",   cols:[0]},
      {e:"-am",  cols:[1]},
      {e:"-ae",  cols:[2,3]}, // Gen / Dat
      {e:"-ā",   cols:[4]}
    ];
  }

  if (gameMode.decl === "1st" && gameMode.number === "plur") {
    return [
      {e:"-ae",    cols:[0]},
      {e:"-ās",    cols:[1]},
      {e:"-ārum",  cols:[2]},
      {e:"-īs",    cols:[3,4]} // Dat / Abl
    ];
  }
  return [];
}

/* ================= GAME SETUP ================= */

function shuffle(a) {
  for (let i=a.length-1;i>0;i--) {
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
}

function isSpawnable(ending) {
  return ending.cols.some(c => stacks[c].length < STACK_TARGET);
}

function rebuildSpawn() {
  spawn = buildEndings().filter(isSpawnable);
  shuffle(spawn);
}

function resetGame() {
  stacks = [[],[],[],[],[]];
  lives = 6;
  paused = win = lose = false;
  started = true;
  rebuildSpawn();
  spawnBlock();
}

function spawnBlock() {
  if (!spawn.length || win || lose) return;
  const b = spawn.pop();
  falling = {
    col: Math.floor(Math.random()*COLS),
    y: -60,
    size: canvas.width/COLS * 0.6,
    e: b.e,
    cols: b.cols,
    fast: false
  };
}

/* ================= UPDATE ================= */

function update() {
  if (!started || paused || win || lose || !falling) return;

  falling.y += falling.fast ? FAST_SPEED : FALL_SPEED;

  const baseY = canvas.height - 90;
  const targetY = baseY - stacks[falling.col].length * 50;

  if (falling.y + falling.size >= targetY) {
    if (falling.cols.includes(falling.col) &&
        stacks[falling.col].length < STACK_TARGET) {
      stacks[falling.col].push(falling.e);
    } else {
      lives--;
      if (lives <= 0) lose = true;
    }

    falling = null;
    rebuildSpawn();
    if (stacks.every(s=>s.length>=STACK_TARGET)) win = true;
    if (!win && !lose) spawnBlock();
  }
}

/* ================= DRAW ================= */

function draw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillText("Lives: "+lives,10,20);

  const baseY = canvas.height - 90;
  const colW = canvas.width / COLS;

  for (let i=0;i<COLS;i++) {
    ctx.strokeRect(i*colW, baseY, colW, 90);
    ctx.fillText(colNames[i], i*colW+colW/2, baseY+60);
  }

  for (let c=0;c<COLS;c++) {
    for (let s=0;s<stacks[c].length;s++) {
      const y = baseY - (s+1)*50;
      ctx.fillRect(c*colW+6,y,colW-12,46);
      if (stacks[c].length===STACK_TARGET && s===STACK_TARGET-1) {
        ctx.fillText(stacks[c][s],c*colW+colW/2,y+23);
      }
    }
  }

  if (falling) {
    ctx.fillRect(
      falling.col*colW+10,
      falling.y,
      colW-20,
      falling.size
    );
    ctx.fillText(
      falling.e,
      falling.col*colW+colW/2,
      falling.y+falling.size/2
    );
  }
}

/* ================= LOOP ================= */

function loop() {
  update();
  draw();
  if (win||lose) {
    document.getElementById("endMsg").textContent = win ? "YOU WIN" : "YOU LOSE";
    document.getElementById("endScreen").classList.remove("hidden");
  }
  requestAnimationFrame(loop);
}
loop();

/* ================= UI ================= */

document.querySelectorAll(".cell.active").forEach(cell=>{
  cell.onclick = () => {
    gameMode.decl = cell.dataset.decl;
    gameMode.number = cell.dataset.num;
    document.getElementById("introScreen").classList.add("hidden");
    resetGame();
  };
});

document.getElementById("restart").onclick = () => {
  document.getElementById("endScreen").classList.add("hidden");
  document.getElementById("introScreen").classList.remove("hidden");
  started = false;
};

document.getElementById("pauseBtn").onclick = () => {
  paused = !paused;
};
</script>

</body>
</html>
