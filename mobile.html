<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Latin Case Blocks v17 (Phone)</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100dvh;
  overflow: hidden;
  font-family: sans-serif;
  color: #fff;
  user-select: none;
  background: url("pool.svg") center / cover no-repeat fixed;
}

@media (pointer: coarse), (max-width: 820px) {
  html, body {
    background-attachment: scroll;
    background-position: center top;
  }
}

#bgOverlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.45);
  z-index: 0;
}

canvas {
  position: fixed;
  inset: 0;
  z-index: 1;
  width: 100vw;
  height: 100dvh;
  touch-action: none;
}

#pauseBtn {
  position: fixed;
  top: 10px;
  right: 10px;
  z-index: 6;
  padding: 8px 12px;
  font-size: 16px;
}

#mobileControls {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 7;
  display: none;
  justify-content: center;
  gap: 12px;
  padding: 12px 12px calc(12px + env(safe-area-inset-bottom));
  background: rgba(0,0,0,0.35);
}

#mobileControls.forceHidden { display: none !important; }

@media (pointer: coarse), (max-width: 820px) {
  #mobileControls { display: flex; }
}

.ctrlBtn {
  width: 72px;
  height: 60px;
  border-radius: 14px;
  font-size: 26px;
  color: #fff;
  background: rgba(255,255,255,0.18);
}
</style>
</head>

<body>

<div id="bgOverlay"></div>
<canvas id="game"></canvas>
<button id="pauseBtn">Pause</button>

<div id="mobileControls" class="forceHidden">
  <button id="btnLeft"  class="ctrlBtn">◀</button>
  <button id="btnDown"  class="ctrlBtn">▼</button>
  <button id="btnRight" class="ctrlBtn">▶</button>
</div>

<script>
/* ================= CANVAS ================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const COLS = 5;
const STACK_TARGET = 3;
const colNames = ["Nom","Acc","Gen","Dat","Abl"];

const LABEL_H = 30;   // label text height
const LABEL_GAP = 8;  // visual gap above labels

let controlsH = 0;
const mobileControls = document.getElementById("mobileControls");

function recomputeLayout() {
  controlsH = mobileControls.classList.contains("forceHidden")
    ? 0
    : mobileControls.getBoundingClientRect().height;
}

function resize() {
  const vv = window.visualViewport;
  canvas.width  = Math.round(vv ? vv.width  : innerWidth);
  canvas.height = Math.round(vv ? vv.height : innerHeight);
  recomputeLayout();
}
resize();
addEventListener("resize", resize);
if (window.visualViewport) window.visualViewport.addEventListener("resize", resize);

/* stack floor: 8px above labels */
function baseY() {
  return canvas.height - controlsH - LABEL_H - LABEL_GAP;
}

function colWidth() { return canvas.width / COLS; }
function stackHeight() { return Math.min(56, colWidth() * 0.55); }

/* ================= DEMO DRAW ================= */

let stacks = [[],[],[],[],[]];

function draw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const bY = baseY();

  /* stacks */
  for (let c=0;c<COLS;c++) {
    for (let s=0;s<stacks[c].length;s++) {
      const y = bY - (s+1)*stackHeight();
      ctx.fillStyle = "#2f7d32";
      ctx.fillRect(c*colWidth()+6, y, colWidth()-12, stackHeight()-4);
    }
  }

  /* labels */
  ctx.fillStyle = "#fff";
  ctx.textAlign = "center";
  ctx.textBaseline = "top";
  for (let i=0;i<COLS;i++) {
    ctx.fillText(colNames[i], i*colWidth()+colWidth()/2, bY + LABEL_GAP);
  }
}

function loop() {
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
