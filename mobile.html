<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Latin Case Blocks v17 (Phone)</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  font-family: sans-serif;
  color: #fff;
  user-select: none;
  background: url("pool.svg") center / cover no-repeat fixed;
}

@media (pointer: coarse), (max-width: 820px) {
  html, body {
    background-attachment: scroll;
    background-position: center top;
  }
}

/* dark overlay */
#bgOverlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.45);
  z-index: 0;
}

canvas {
  position: relative;
  z-index: 1;
  display: block;
  width: 100vw;
  height: 100vh;
  background: transparent;
  touch-action: none;
}

/* SEE-THROUGH PAUSE BUTTON */
#pauseBtn {
  position: fixed;
  top: 10px;
  right: 10px;
  z-index: 6;
  padding: 8px 12px;
  font-size: 16px;
  background: rgba(0,0,0,0.25);
  color: #fff;
  border: 1px solid rgba(255,255,255,0.35);
  border-radius: 8px;
  backdrop-filter: blur(4px);
}

#startScreen, #endScreen {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.75);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 10;
}

button {
  margin: 8px;
  padding: 10px 18px;
  font-size: 18px;
}

/* Mobile controls */
#mobileControls {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 7;
  display: none;
  justify-content: center;
  gap: 12px;
  padding: 12px 12px calc(12px + env(safe-area-inset-bottom));
  background: rgba(0,0,0,0.35);
  backdrop-filter: blur(6px);
}

#mobileControls.forceHidden { display: none !important; }

@media (pointer: coarse), (max-width: 820px) {
  #mobileControls { display: flex; }
}

.ctrlBtn {
  width: 72px;
  height: 60px;
  border: 0;
  border-radius: 14px;
  font-size: 26px;
  color: #fff;
  background: rgba(255,255,255,0.18);
  touch-action: manipulation;
}

.ctrlBtn:active { transform: scale(0.98); }
</style>
</head>

<body>

<div id="bgOverlay"></div>

<canvas id="game"></canvas>
<button id="pauseBtn">Pause</button>

<div id="mobileControls" class="forceHidden">
  <button id="btnLeft" class="ctrlBtn">◀</button>
  <button id="btnDown" class="ctrlBtn">▼</button>
  <button id="btnRight" class="ctrlBtn">▶</button>
</div>

<div id="startScreen">
  <h1>Latin Case Blocks</h1>
  <p>First Declension Singular</p>
  <button id="volumeToggle">Music: ON</button>
  <button id="playBtn">Play</button>
</div>

<div id="endScreen" style="display:none;">
  <h1 id="endMsg"></h1>
  <button id="restart">Play Again</button>
</div>

<script>
/* AUDIO */
const music = new Audio("tetris.mp3");
music.loop = true;
music.volume = 0.25;
let musicOn = true;

/* CANVAS */
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

/* LAYOUT */
const FOOTER_H = 48;   // reduced: labels only
let controlsH = 0;
const mobileControls = document.getElementById("mobileControls");

function recomputeLayout() {
  const cssVisible = getComputedStyle(mobileControls).display !== "none";
  const codeVisible = !mobileControls.classList.contains("forceHidden");
  controlsH = (cssVisible && codeVisible)
    ? mobileControls.getBoundingClientRect().height
    : 0;
}

function baseY() {
  return canvas.height - controlsH - FOOTER_H;
}

function resize() {
  canvas.width = innerWidth;
  canvas.height = innerHeight;
  recomputeLayout();
}
resize();
addEventListener("resize", resize);
addEventListener("orientationchange", () => setTimeout(resize, 50));

/* GAME DATA */
const COLS = 5;
const STACK_TARGET = 3;
const colNames = ["Nom", "Acc", "Gen", "Dat", "Abl"];

const ENDINGS = [
  {e:"-a",c:0},{e:"-a",c:0},{e:"-a",c:0},
  {e:"-am",c:1},{e:"-am",c:1},{e:"-am",c:1},
  {e:"-ae",c:2},{e:"-ae",c:2},{e:"-ae",c:2},
  {e:"-ae",c:3},{e:"-ae",c:3},{e:"-ae",c:3},
  {e:"-ā",c:4},{e:"-ā",c:4},{e:"-ā",c:4}
];

let spawn=[], falling=null;
let stacks=[[],[],[],[],[]];
let lives=6, paused=false, win=false, lose=false, started=false;

const BASE_FALL_SPEED = 2.5/3;
const FAST_FALL_SPEED = 12.5;

function colWidth(){ return canvas.width/COLS; }
function stackHeight(){ return Math.min(56,colWidth()*0.55); }

/* SPAWN */
function resetSpawn(){
  spawn=ENDINGS.slice();
  for(let i=spawn.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [spawn[i],spawn[j]]=[spawn[j],spawn[i]];
  }
}
function spawnBlock(){
  if(falling||!spawn.length||win||lose) return;
  const b=spawn.pop();
  falling={col:Math.floor(Math.random()*COLS),y:-60,size:colWidth()*0.6,e:b.e,c:b.c,fast:false};
}

/* DRAW */
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle="#fff";
  ctx.fillText("Lives: "+lives,10,10);

  const bY=baseY();

  for(let i=0;i<COLS;i++){
    const x=i*colWidth();
    ctx.strokeStyle="rgba(255,255,255,0.6)";
    ctx.strokeRect(x,bY,colWidth(),FOOTER_H);
    ctx.textAlign="center";
    ctx.fillText(colNames[i],x+colWidth()/2,bY+FOOTER_H-26);
  }

  for(let c=0;c<COLS;c++){
    for(let s=0;s<stacks[c].length;s++){
      const y=bY-(s+1)*stackHeight();
      ctx.fillStyle="#2f7d32";
      ctx.fillRect(c*colWidth()+6,y,colWidth()-12,stackHeight()-4);
      if(stacks[c].length===STACK_TARGET && s===STACK_TARGET-1){
        ctx.fillStyle="#fff";
        ctx.textAlign="center";
        ctx.textBaseline="middle";
        ctx.fillText(stacks[c][s],c*colWidth()+colWidth()/2,y+stackHeight()/2);
      }
    }
  }

  if(falling){
    ctx.fillStyle="#b71c1c";
    ctx.fillRect(falling.col*colWidth()+10,falling.y,colWidth()-20,falling.size);
    ctx.fillStyle="#fff";
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    ctx.fillText(falling.e,falling.col*colWidth()+colWidth()/2,falling.y+falling.size/2);
  }
}

/* UPDATE */
function update(){
  if(!started||paused||win||lose||!falling) return;
  falling.y+=falling.fast?FAST_FALL_SPEED:BASE_FALL_SPEED;
  const bY=baseY();
  const targetY=bY-stacks[falling.col].length*stackHeight();

  if(falling.y+falling.size>=targetY){
    const correct=(falling.e==="-ae")?[2,3]:[falling.c];
    let placed=false;

    for(const col of correct){
      if(col===falling.col && stacks[col].length<STACK_TARGET){
        stacks[col].push(falling.e); placed=true; break;
      }
    }

    if(!placed && correct.length===2){
      const other=correct.find(c=>c!==falling.col);
      if(stacks[other].length<STACK_TARGET){
        stacks[other].push(falling.e); placed=true;
      }
    }

    if(!placed){
      spawn.push({e:falling.e,c:falling.c});
      if(!correct.includes(falling.col)){
        lives--; if(lives<=0) lose=true;
      }
    }

    falling=null;
    if(stacks.every(s=>s.length>=STACK_TARGET)) win=true;
    if(!win&&!lose) spawnBlock();
  }
}

/* CONTROLS */
function setPaused(p){
  paused=p;
  pauseBtn.textContent=paused?"Resume":"Pause";
  paused?music.pause():musicOn&&started&&!win&&!lose&&music.play().catch(()=>{});
}

addEventListener("keydown",e=>{
  if(["ArrowLeft","ArrowRight","ArrowDown","Space"].includes(e.code)) e.preventDefault();
  if(e.code==="Space"){ if(started&&!win&&!lose) setPaused(!paused); return; }
  if(paused||win||lose||!falling) return;
  if(e.key==="ArrowLeft") falling.col=Math.max(0,falling.col-1);
  if(e.key==="ArrowRight") falling.col=Math.min(COLS-1,falling.col+1);
  if(e.key==="ArrowDown") falling.fast=true;
});

addEventListener("keyup",e=>{ if(falling&&e.key==="ArrowDown") falling.fast=false; });
canvas.addEventListener("dblclick",()=>{ if(falling&&!paused) falling.fast=true; });

/* UI */
const volumeToggle=document.getElementById("volumeToggle");
const playBtn=document.getElementById("playBtn");
const pauseBtn=document.getElementById("pauseBtn");

volumeToggle.onclick=()=>{
  musicOn=!musicOn;
  volumeToggle.textContent="Music: "+(musicOn?"ON":"OFF");
  if(!musicOn) music.pause();
};

playBtn.onclick=()=>{
  document.getElementById("startScreen").style.display="none";
  started=true; win=lose=false; lives=6;
  stacks=[[],[],[],[],[]]; falling=null;
  resetSpawn(); spawnBlock(); setPaused(false);
  musicOn&&music.play().catch(()=>{});
};

pauseBtn.onclick=()=>{ if(started&&!win&&!lose) setPaused(!paused); };

document.getElementById("restart").onclick=()=>{
  document.getElementById("endScreen").style.display="none";
  playBtn.onclick();
};

/* LOOP */
function loop(){
  update(); draw();
  if(win||lose){
    document.getElementById("endMsg").textContent=win?"YOU WIN":"YOU LOSE";
    document.getElementById("endScreen").style.display="flex";
    music.pause();
  }
  requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
