<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Latin Case Blocks</title>
  <style>
    html, body { margin:0; height:100%; background:#000; }
    .msg { color:#fff; font:16px/1.3 sans-serif; padding:16px; }
  </style>
</head>
<body>
  <div class="msg">Loading…</div>

  <script>
  (function () {
    // Optional overrides:
    //   ?mode=mobile  or  ?mode=desktop
    const params = new URLSearchParams(location.search);
    const forced = params.get("mode");

    const mm = (q) => (window.matchMedia ? window.matchMedia(q).matches : false);

    // Touch-first devices typically match (pointer: coarse). MDN defines coarse as limited-accuracy primary pointer (e.g., finger). 
    const isCoarsePointer = mm("(pointer: coarse)");
    const isNarrow = mm("(max-width: 820px)");

    // Fallback if matchMedia is unavailable
    const fallbackTouch = ("ontouchstart" in window) || (navigator.maxTouchPoints > 0);

    const wantsMobile =
      forced === "mobile" ? true :
      forced === "desktop" ? false :
      (isCoarsePointer || isNarrow || fallbackTouch);

    // Keep any other query params (except mode) if you want:
    params.delete("mode");
    const rest = params.toString();
    const suffix = rest ? ("?" + rest) : "";

    location.replace((wantsMobile ? "mobile.html" : "desktop.html") + suffix);
  })();
  </script>
</body>
</html>
